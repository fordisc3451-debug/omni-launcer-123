{% extends "base.html" %}{% block content %}<section class="auth card"><div class="eyebrow">GET STARTED</div><h1>Create your account</h1><p class="muted">A valid registration key is required.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username</label><input name="username" autocomplete="username" required minlength="3" maxlength="32"><label>Password</label><input type="password" name="password" autocomplete="new-password" required minlength="12"><small>Use at least 12 characters.</small><label>Registration key</label><input name="license_key" required autocomplete="off"><button class="primary full">Create account</button></form>
<p class="below">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section>{% endblock %}
